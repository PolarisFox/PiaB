<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프린세스 인 어 박스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --page: #e2ead2;
    --page-low: #cfdcb9;
    --sky: #c4d3ac;
    --ink: #3a4630;
    --ink-soft: #66755a;
    --panel: #f6f9ec;
    --u: min(calc((100vw - 56px) / 6.5), 76px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #1d271c;
      --page-low: #172016;
      --sky: #273626;
      --ink: #e5eed8;
      --ink-soft: #a5b498;
      --panel: #2a372a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #1d271c;
    --page-low: #172016;
    --sky: #273626;
    --ink: #e5eed8;
    --ink-soft: #a5b498;
    --panel: #2a372a;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; }
  body {
    min-height: 100%;
    background: linear-gradient(var(--page), var(--page-low));
    color: var(--ink);
    font-family: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .app { max-width: 540px; margin: 0 auto; padding: 10px 12px 24px; }

  /* 상단 바 */
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 2px 8px; }
  .stages { display: flex; gap: 6px; }
  .stages button {
    font: inherit; font-size: 15px; width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--ink-soft); background: transparent; color: var(--ink); cursor: pointer;
  }
  .stages button[aria-current="true"] { background: #b9552b; border-color: #b9552b; color: #fff; }
  .stages button:focus-visible, .btn:focus-visible { outline: 3px solid #e9a23b; outline-offset: 2px; }
  .minInfo { font-size: 15px; color: var(--ink-soft); }

  /* 안내 문구 + 도시 실루엣 */
  .sky { position: relative; min-height: 118px; padding: 6px 4px 0; }
  .sky svg { position: absolute; left: -12px; right: -12px; bottom: 0; width: calc(100% + 24px); height: 70px; fill: var(--sky); }
  .msg { position: relative; margin: 0; font-size: clamp(19px, 5.4vw, 25px); line-height: 1.45; word-break: keep-all; }

  /* 목재 콘솔 */
  .console {
    position: relative;
    margin-top: 6px;
    padding: 14px 14px 16px;
    border-radius: 10px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.045) 0 2px, transparent 2px 7px),
      linear-gradient(#a56d41, #8a5731);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.22), inset 0 -3px 0 rgba(0,0,0,.28), 0 6px 14px rgba(0,0,0,.28);
  }
  .led-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  .led {
    position: relative; min-width: 86px; padding: 3px 12px; border-radius: 4px; text-align: center;
    background: #2b0f0c; box-shadow: inset 0 2px 5px #000, 0 1px 0 rgba(255,255,255,.3);
    font-size: 26px; letter-spacing: 3px; line-height: 1.15;
  }
  .led .ghost { color: #4a1612; }
  .led #led { position: absolute; inset: 3px 12px; color: #ff3b2f; text-shadow: 0 0 8px rgba(255,59,47,.8); }

  .stage { display: flex; align-items: flex-start; }
  .board {
    position: relative;
    width: calc(5 * var(--u)); height: calc(4 * var(--u));
    border: 7px solid #3f2816; border-right: 0;
    background:
      linear-gradient(rgba(0,0,0,.14) 1px, transparent 1px) 0 0 / var(--u) var(--u),
      linear-gradient(90deg, rgba(0,0,0,.14) 1px, transparent 1px) 0 0 / var(--u) var(--u),
      #62402a;
    box-shadow: inset 0 0 16px rgba(0,0,0,.65);
    border-radius: 4px 0 0 4px;
    touch-action: none;
  }
  .board::before, .board::after {
    content: ""; position: absolute; left: 100%; width: 11px; background: #3f2816;
  }
  .board::before { top: -7px; height: calc(var(--u) + 7px); border-radius: 0 4px 0 0; }
  .board::after { top: calc(3 * var(--u)); height: calc(var(--u) + 7px); border-radius: 0 0 4px 0; }
  .zone {
    position: absolute; left: calc(3 * var(--u)); top: var(--u); width: calc(2 * var(--u)); height: calc(2 * var(--u));
    background: rgba(20, 8, 0, .38); box-shadow: inset 0 0 12px rgba(0,0,0,.5);
  }

  /* 출구 + 공주 실루엣 */
  .exit { position: relative; width: calc(1.5 * var(--u) + 7px); height: calc(4 * var(--u)); margin-left: 11px; }
  .exit .arrow { position: absolute; left: 0; width: calc(.7 * var(--u)); color: #2fb3b0; filter: drop-shadow(0 1px 0 rgba(0,0,0,.35)); }
  .exit .arrow:nth-child(1) { top: calc(1.5 * var(--u) - 9px); }
  .exit .arrow:nth-child(2) { top: calc(2.5 * var(--u) - 9px); }
  .exit .silhouette {
    position: absolute; right: 0; top: calc(2 * var(--u) - .85 * var(--u)); height: calc(1.7 * var(--u));
    color: #5b3a24; opacity: .85; transition: color .6s, opacity .6s, transform .6s;
  }
  .escaped .exit .silhouette { color: #ee6f9c; opacity: 1; transform: scale(1.12); }
  .exit .arrow svg, .exit .silhouette svg { display: block; width: 100%; height: 100%; fill: currentColor; }
  .exit .silhouette svg { width: auto; }

  /* 블록 */
  .piece {
    position: absolute;
    left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u));
    width: calc(var(--w) * var(--u)); height: calc(var(--h) * var(--u));
    touch-action: none; cursor: grab; outline: none;
    transition: transform .16s ease, opacity .8s ease;
  }
  .piece.dragging { cursor: grabbing; z-index: 5; transition: none; }
  .face {
    position: absolute; inset: 2px; border-radius: 6px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.38), inset 0 -4px 0 rgba(0,0,0,.26), 0 2px 4px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
  }
  .t-h .face { background: linear-gradient(#69a3ad, #447a86); }
  .t-g .face { background: linear-gradient(#66b972, #3f8c4e); }
  .t-v .face { background: linear-gradient(#9366c8, #6c4299); }
  .t-p .face { background: linear-gradient(#e2784a, #ad4722); }
  .t-p .face svg { width: 38%; height: 62%; fill: rgba(255, 230, 205, .55); }
  .piece:focus-visible .face, .piece.selected .face { box-shadow: inset 0 0 0 3px #ffd36a, 0 2px 4px rgba(0,0,0,.4); }
  .piece.hint .face { animation: pulse 0.9s ease-in-out infinite; }
  .piece.hint::after {
    content: attr(data-dir); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--u) * .5); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none;
  }
  @keyframes pulse { 50% { filter: brightness(1.35); } }
  .piece.out { transform: translateX(calc(2.7 * var(--u))); opacity: 0; transition: transform .9s ease-in, opacity .9s ease-in; }

  /* 하단 버튼 */
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .btn {
    font: inherit; font-size: clamp(15px, 4vw, 18px); color: #fff; cursor: pointer;
    padding: 10px 4px; border-radius: 8px; border: 0;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.3);
  }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .b-hint { background: #e89a2d; }
  .b-later { background: #3f9ca3; }
  .b-undo { background: #52a86a; }
  .b-reset { background: #777d78; }

  /* 클리어 창 */
  .win {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(30, 14, 4, .55); border-radius: 10px; z-index: 20;
  }
  .win.show { display: flex; }
  .win .card {
    background: var(--panel); color: var(--ink); padding: 18px 22px 16px; border-radius: 12px; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); width: min(84%, 300px);
  }
  .win h2 { margin: 0 0 4px; font-size: 28px; font-weight: 400; }
  .win .stars { font-size: 30px; color: #e9a23b; letter-spacing: 4px; }
  .win p { margin: 6px 0 12px; font-size: 16px; color: var(--ink-soft); }
  .win .row { display: flex; gap: 8px; }
  .win .row .btn { flex: 1; }

  @media (prefers-reduced-motion: reduce) {
    .piece, .piece.out { transition: none; }
    .piece.hint .face { animation: none; filter: brightness(1.3); }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="princess" viewBox="0 0 60 80">
    <path d="M23 7 L26 1 L30 5 L34 1 L37 7 Z"/>
    <circle cx="30" cy="14" r="7"/>
    <path d="M30 22 C24 22 22 29 24 35 L19 42 L7 74 C7 77 10 79 14 79 L46 79 C50 79 53 77 53 74 L41 42 L36 35 C38 29 36 22 30 22 Z"/>
  </symbol>
</svg>

<main class="app" id="app">
  <header class="hud">
    <div class="stages" id="stages" role="group" aria-label="퍼즐 선택"></div>
    <div class="minInfo" id="minInfo"></div>
  </header>

  <section class="sky">
    <svg viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 70V44h22V30h18v14h14V20l14-10 14 10v24h20V36h24V52h16V28h20V16h16v28h18V38h24V24l12-8 12 8v22h20V34h22v18h18V30h18V46h20V70Z"/>
    </svg>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>

  <section class="console" id="console">
    <div class="led-wrap">
      <div class="led" aria-label="이동 횟수"><span class="ghost">888</span><span id="led">000</span></div>
    </div>
    <div class="stage" id="stageWrap">
      <div class="board" id="board">
        <div class="zone"></div>
      </div>
      <div class="exit" aria-hidden="true">
        <div class="arrow"><svg viewBox="0 0 40 18"><path d="M0 6h26V0l14 9-14 9v-6H0Z"/></svg></div>
        <div class="arrow"><svg viewBox="0 0 40 18"><path d="M0 6h26V0l14 9-14 9v-6H0Z"/></svg></div>
        <div class="silhouette"><svg viewBox="0 0 60 80"><use href="#princess"/></svg></div>
      </div>
    </div>
    <div class="win" id="win" role="dialog" aria-live="polite">
      <div class="card">
        <h2>탈출 성공!</h2>
        <div class="stars" id="stars"></div>
        <p id="winText"></p>
        <div class="row">
          <button class="btn b-reset" id="winRetry" type="button">다시하기</button>
          <button class="btn b-hint" id="winNext" type="button">다음 퍼즐</button>
        </div>
      </div>
    </div>
  </section>

  <nav class="actions" aria-label="게임 메뉴">
    <button class="btn b-hint" id="hintBtn" type="button">힌트</button>
    <button class="btn b-later" id="laterBtn" type="button">나중에 풀기</button>
    <button class="btn b-undo" id="undoBtn" type="button">되돌리기</button>
    <button class="btn b-reset" id="resetBtn" type="button">다시하기</button>
  </nav>
</main>

<script>
(function () {
  'use strict';
  var W = 5, H = 4;
  var DEFAULT_MSG = '앞을 막고 있는 블록들을 치우고 빨간색의 큰 블록을 오른쪽 출구로 빼내어라.';

  // [가로, 세로, x, y]
  var LEVELS = [
    [[2,2,0,1],[2,1,0,0],[2,1,2,0],[1,1,4,0],[1,2,2,1],[1,1,3,1],[1,1,3,2],[2,1,0,3],[2,1,2,3],[1,1,4,3]],
    [[2,2,1,1],[2,1,3,3],[2,1,0,0],[1,2,3,1],[1,1,0,3],[1,1,4,0],[1,1,3,0],[1,1,1,3]],
    [[2,2,1,2],[2,1,1,0],[2,1,1,1],[2,1,3,2],[1,2,4,0],[1,1,3,1],[1,1,3,0],[1,1,3,3]],
    [[2,2,1,0],[2,1,3,0],[2,1,2,3],[1,2,3,1],[1,2,4,2],[1,2,1,2],[1,1,0,2],[1,1,0,1],[1,1,4,1]],
    [[2,2,1,2],[2,1,3,1],[2,1,3,2],[1,2,0,0],[1,2,0,2],[1,2,1,0],[1,1,3,0],[1,1,2,0],[1,1,4,0],[1,1,2,1]]
  ];
  var MIN_MOVES = [90, 11, 18, 48, 58];
  var COLOR_NAME = { p: '빨간 큰', h: '가로로 긴 청록색', v: '세로로 긴 보라색', g: '초록색' };
  var DIRS = { L: [-1, 0, '←', '왼쪽'], R: [1, 0, '→', '오른쪽'], U: [0, -1, '↑', '위쪽'], D: [0, 1, '↓', '아래쪽'] };

  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $('board'), msgEl = $('msg'), ledEl = $('led'), winEl = $('win');
  var stagesEl = $('stages'), minInfoEl = $('minInfo'), consoleEl = $('console');

  var levelIdx = 0, pieces = [], els = [], history = [], moves = 0, won = false, selected = -1;
  var minMoves = 0;

  function typeOf(w, h) { return w === 2 && h === 2 ? 'p' : (w === 2 ? 'h' : (h === 2 ? 'v' : 'g')); }

  function grid(ps, skip) {
    var g = [], y, x;
    for (y = 0; y < H; y++) { g.push([]); for (x = 0; x < W; x++) g[y].push(-1); }
    ps.forEach(function (p, i) {
      if (i === skip) return;
      for (var dy = 0; dy < p.h; dy++) for (var dx = 0; dx < p.w; dx++) g[p.y + dy][p.x + dx] = i;
    });
    return g;
  }

  function fits(g, p, nx, ny) {
    if (nx < 0 || ny < 0 || nx + p.w > W || ny + p.h > H) return false;
    for (var dy = 0; dy < p.h; dy++) for (var dx = 0; dx < p.w; dx++) if (g[ny + dy][nx + dx] !== -1) return false;
    return true;
  }

  function limits(i) {
    var g = grid(pieces, i), p = pieces[i], out = {};
    Object.keys(DIRS).forEach(function (k) {
      var d = DIRS[k], n = 0;
      while (fits(g, p, p.x + d[0] * (n + 1), p.y + d[1] * (n + 1))) n++;
      out[k] = n;
    });
    return out;
  }

  /* ---------- 힌트용 BFS ---------- */
  function keyOf(ps) {
    var cells = new Array(W * H).fill('.');
    ps.forEach(function (p) {
      for (var dy = 0; dy < p.h; dy++) for (var dx = 0; dx < p.w; dx++)
        cells[(p.y + dy) * W + p.x + dx] = p.t + dx + dy;
    });
    return cells.join(',');
  }
  function isGoal(ps) {
    for (var i = 0; i < ps.length; i++) if (ps[i].t === 'p') return ps[i].x === 3 && ps[i].y === 1;
    return false;
  }
  function fitsSelf(g, p, i, nx, ny) {
    if (nx < 0 || ny < 0 || nx + p.w > W || ny + p.h > H) return false;
    for (var dy = 0; dy < p.h; dy++) for (var dx = 0; dx < p.w; dx++) {
      var v = g[ny + dy][nx + dx];
      if (v !== -1 && v !== i) return false;
    }
    return true;
  }
  function solve(ps) {
    var start = ps.map(function (p) { return { w: p.w, h: p.h, x: p.x, y: p.y, t: p.t }; });
    var states = [start], par = [-1], mv = [null], seen = {}, qi = 0;
    seen[keyOf(start)] = true;
    if (isGoal(start)) return [];
    var keys = Object.keys(DIRS);
    while (qi < states.length) {
      var s = states[qi], g = grid(s, -1);
      for (var i = 0; i < s.length; i++) {
        var p = s[i], ox = p.x, oy = p.y;
        for (var ki = 0; ki < keys.length; ki++) {
          var k = keys[ki], d = DIRS[k], n = 1;
          while (fitsSelf(g, p, i, ox + d[0] * n, oy + d[1] * n)) {
            p.x = ox + d[0] * n; p.y = oy + d[1] * n;
            var key = keyOf(s);
            if (!seen[key]) {
              seen[key] = true;
              var t = s.map(function (q) { return { w: q.w, h: q.h, x: q.x, y: q.y, t: q.t }; });
              states.push(t); par.push(qi); mv.push({ i: i, dir: k, n: n });
              if (isGoal(t)) {
                var path = [], c = states.length - 1;
                while (par[c] !== -1) { path.push(mv[c]); c = par[c]; }
                return path.reverse();
              }
            }
            n++;
          }
          p.x = ox; p.y = oy;
        }
      }
      qi++;
    }
    return null;
  }

  /* ---------- 화면 ---------- */
  function setMsg(t) { msgEl.textContent = t; }
  function updateLed() { ledEl.textContent = String(Math.min(moves, 999)).padStart(3, '0'); }
  function place(i) {
    var p = pieces[i], el = els[i];
    el.style.setProperty('--x', p.x); el.style.setProperty('--y', p.y);
  }
  function clearHint() {
    els.forEach(function (el) { el.classList.remove('hint'); el.removeAttribute('data-dir'); });
  }
  function select(i) {
    selected = i;
    els.forEach(function (el, j) { el.classList.toggle('selected', j === i); });
  }

  function buildStages() {
    stagesEl.textContent = '';
    LEVELS.forEach(function (_, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = i + 1; b.setAttribute('aria-label', '퍼즐 ' + (i + 1));
      b.addEventListener('click', function () { loadLevel(i); });
      stagesEl.appendChild(b);
    });
  }

  function loadLevel(idx) {
    levelIdx = ((idx % LEVELS.length) + LEVELS.length) % LEVELS.length;
    els.forEach(function (el) { el.remove(); });
    pieces = LEVELS[levelIdx].map(function (d) { return { w: d[0], h: d[1], x: d[2], y: d[3], t: typeOf(d[0], d[1]) }; });
    els = []; history = []; moves = 0; won = false; selected = -1;
    consoleEl.classList.remove('escaped');
    winEl.classList.remove('show');

    pieces.forEach(function (p, i) {
      var el = document.createElement('div');
      el.className = 'piece t-' + p.t;
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', COLOR_NAME[p.t] + ' 블록');
      el.style.setProperty('--w', p.w); el.style.setProperty('--h', p.h);
      var face = document.createElement('div');
      face.className = 'face';
      if (p.t === 'p') face.innerHTML = '<svg viewBox="0 0 60 80"><use href="#princess"/></svg>';
      el.appendChild(face);
      boardEl.appendChild(el);
      els.push(el);
      place(i);
      bindDrag(el, i);
      el.addEventListener('focus', function () { if (!won) select(i); });
      el.addEventListener('keydown', function (e) { onKey(e, i); });
    });

    Array.prototype.forEach.call(stagesEl.children, function (b, i) {
      if (i === levelIdx) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
    setMsg(DEFAULT_MSG);
    updateLed();
    minMoves = MIN_MOVES[levelIdx];
    minInfoEl.textContent = minMoves ? '최소 ' + minMoves + '수' : '';
  }

  /* ---------- 이동 ---------- */
  function commit(i, nx, ny) {
    var p = pieces[i];
    history.push({ i: i, x: p.x, y: p.y });
    p.x = nx; p.y = ny; moves++;
    updateLed(); clearHint(); setMsg(DEFAULT_MSG);
    place(i);
    if (p.t === 'p' && p.x === 3 && p.y === 1) win();
  }

  function onKey(e, i) {
    if (won) return;
    var map = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D' };
    var k = map[e.key];
    if (!k) return;
    e.preventDefault();
    var lim = limits(i);
    if (lim[k] > 0) commit(i, pieces[i].x + DIRS[k][0], pieces[i].y + DIRS[k][1]);
  }

  function bindDrag(el, i) {
    var sx, sy, axis, lim, u, active = false, off = 0;
    el.addEventListener('pointerdown', function (e) {
      if (won) return;
      active = true; axis = null; off = 0;
      sx = e.clientX; sy = e.clientY;
      u = boardEl.getBoundingClientRect().width / W;
      lim = limits(i);
      el.setPointerCapture(e.pointerId);
      select(i);
    });
    el.addEventListener('pointermove', function (e) {
      if (!active) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (!axis) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 6) return;
        var horiz = Math.abs(dx) >= Math.abs(dy);
        var canH = lim.L + lim.R > 0, canV = lim.U + lim.D > 0;
        if (horiz && !canH && canV) horiz = false;
        else if (!horiz && !canV && canH) horiz = true;
        axis = horiz ? 'x' : 'y';
        el.classList.add('dragging');
      }
      if (axis === 'x') off = Math.max(-lim.L * u, Math.min(lim.R * u, dx));
      else off = Math.max(-lim.U * u, Math.min(lim.D * u, dy));
      el.style.transform = axis === 'x' ? 'translateX(' + off + 'px)' : 'translateY(' + off + 'px)';
    });
    function end() {
      if (!active) return;
      active = false;
      el.classList.remove('dragging');
      if (!axis) return;
      var cells = Math.round(off / u), p = pieces[i];
      var rest = off - cells * u;
      el.style.transition = 'none';
      if (cells !== 0) {
        commit(i, p.x + (axis === 'x' ? cells : 0), p.y + (axis === 'y' ? cells : 0));
      }
      el.style.transform = axis === 'x' ? 'translateX(' + rest + 'px)' : 'translateY(' + rest + 'px)';
      void el.offsetWidth;
      el.style.transition = '';
      el.style.transform = '';
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  function undo() {
    if (won || !history.length) return;
    var h = history.pop();
    pieces[h.i].x = h.x; pieces[h.i].y = h.y;
    moves = Math.max(0, moves - 1);
    place(h.i); updateLed(); clearHint(); setMsg(DEFAULT_MSG);
  }

  function hint() {
    if (won) return;
    clearHint();
    setMsg('힌트를 찾는 중이에요…');
    setTimeout(function () {
      if (won) return;
      var sol = solve(pieces);
      if (!sol || !sol.length) { setMsg(DEFAULT_MSG); return; }
      var m = sol[0], p = pieces[m.i], d = DIRS[m.dir];
      els[m.i].classList.add('hint');
      els[m.i].setAttribute('data-dir', d[2]);
      setMsg(COLOR_NAME[p.t] + ' 블록을 ' + d[3] + '으로 ' + m.n + '칸 옮겨 보세요. (남은 최소 ' + sol.length + '수)');
    }, 30);
  }

  function win() {
    won = true; select(-1); clearHint();
    consoleEl.classList.add('escaped');
    els.forEach(function (el, i) { if (pieces[i].t === 'p') el.classList.add('out'); });
    var ratio = minMoves ? moves / minMoves : 1;
    var stars = ratio <= 1 ? 3 : (ratio <= 1.4 ? 2 : 1);
    $('stars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    $('winText').textContent = moves + '수로 탈출했어요. 최소 ' + minMoves + '수';
    setMsg('공주님이 무사히 상자를 빠져나왔어요!');
    setTimeout(function () { winEl.classList.add('show'); $('winNext').focus(); }, 950);
  }

  $('hintBtn').addEventListener('click', hint);
  $('undoBtn').addEventListener('click', undo);
  $('resetBtn').addEventListener('click', function () { loadLevel(levelIdx); });
  $('laterBtn').addEventListener('click', function () { loadLevel(levelIdx + 1); });
  $('winRetry').addEventListener('click', function () { loadLevel(levelIdx); });
  $('winNext').addEventListener('click', function () { loadLevel(levelIdx + 1); });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
  });

  buildStages();
  loadLevel(0);
})();
</script>
</body>
</html>
